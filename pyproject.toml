[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-sync"
version = "0.1.0"
description = "Batch upload local FIT files to Garmin Connect China or Global."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "playwright>=1.54",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
]

[project.scripts]
garmin-sync = "garmin_sync.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
